server:
  port: 8080
  open_browser: true

database:
  host: localhost
  port: 5432
  user: stockwise
  password: stockwise123
  name: stockwise_db
  sslmode: disable
  timezone: Asia/Kolkata

data:
  refresh_interval_hours: 6
  history_days: 365
  intraday_interval: "5m"
  intraday_range: "5d"
  source: "yfinance"     # "yfinance" (Yahoo) or "zerodha" (Kite historical; falls back to yfinance when disconnected)
  live_default_qty: 1    # order/paper quantity per trade call in the live engine

markets:
  nse:
    enabled: true
    symbols:
