  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std_dev: 2.0
  vwap_period: 14

recommendation:
  strong_buy_threshold: 75
  buy_threshold: 55
  hold_threshold: 35
  min_confidence: 20

backtest:
  default_capital: 100000
  commission_pct: 0.1
  slippage_pct: 0.05

zerodha:
  api_key: "rhwcpeoekvr0j875"      # override via env ZERODHA_API_KEY
  api_secret: "pvcu5duid5ukd9yt3xhoa2uf5wkipvp8"   # override via env ZERODHA_API_SECRET
  # Must EXACTLY match the "Redirect URL" registered for this app in the Kite
  # developer console (https://developers.kite.trade/apps). For the OCI-hosted
  # deployment served on http://140.245.223.10/ the public callback is below.
  redirect_url: "http://140.245.223.10/api/v1/zerodha/callback"
  # Master kill-switch for placing REAL orders from the web trade ticket.
  # Set false to block all live order placement (the /zerodha/order endpoint
  # returns 403). The frontend also hides the place-order button when false.
  live_trading_enabled: true
