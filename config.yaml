      - KOTAKBANK.NS
      - LT.NS
      - AXISBANK.NS
      - ASIANPAINT.NS
      - MARUTI.NS
      - TITAN.NS
      - BAJFINANCE.NS
      - WIPRO.NS
      - HCLTECH.NS
      - ULTRACEMCO.NS
      - NESTLEIND.NS
      - SUNPHARMA.NS
      - ONGC.NS
      - NTPC.NS
      - POWERGRID.NS
      - ADANIENT.NS
    indices:
      - "^NSEI"
      - "^NSEBANK"

  us:
    enabled: true
    symbols:
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
      - TSLA
      - JPM
      - JNJ
      - V
      - PG
      - MA
      - UNH
      - HD
      - BAC
      - XOM
      - CVX
      - ABBV
      - PFE
